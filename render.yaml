# Render.com Single-Service Deployment for JanSetu AI
# Frontend + Backend served from one service
services:
  - type: web
    name: jansetu-ai
    env: python
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: NODE_VERSION
        value: 18.17.0
      - key: FLASK_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Set this in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
